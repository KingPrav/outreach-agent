[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outreach-agent"
version = "0.2.0"
description = "LangGraph agent that drafts fact-checked, personalized job outreach. Never sends anything."
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=2.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
outreach-agent = "outreach_agent.cli:main"

[tool.setuptools]
packages = ["outreach_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
